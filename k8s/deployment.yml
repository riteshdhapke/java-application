apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: demo
          image: ghcr.io/YOUR_GITHUB_USERNAME/demo-app:latest
          ports:
            - containerPort: 8080
